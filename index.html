<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page_title">4-7-8 Breathing Exercise</title>

    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:title" content="4-7-8 Breathing Exercise App">
    <meta property="og:description" content="A web application designed to guide users through the 4-7-8 breathing technique, helping reduce anxiety and promote better sleep.">
    <meta property="og:image" content="https://patrickcmserrano.github.io/breathing-app/assets/images/thumbnail.jpg">
    <meta property="og:url" content="https://patrickcmserrano.github.io/breathing-app/">
    <meta property="og:type" content="website">

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="4-7-8 Breathing Exercise App">
    <meta name="twitter:description" content="A web application designed to guide users through the 4-7-8 breathing technique, helping reduce anxiety and promote better sleep.">
    <meta name="twitter:image" content="https://patrickcmserrano.github.io/breathing-app/assets/images/thumbnail.jpg">

    <!-- CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>
    <div class="background-animation"></div>
    
    
    <div class="menu grid">
        <div class="language-buttons">
            <button class="language-button" data-lang="en">En-US</button>
            <button class="language-button" data-lang="pt-BR">Pt-BR</button>
        </div>
        <div  class="menu">
            <nav>
                <ul>
                    <li><strong data-i18n="nav_home">Home</strong></li>
                    <li><a href="about.html" data-i18n="nav_about">About</a></li>
                    <li><a href="copyright.html" data-i18n="nav_copyright">Copyright</a></li>
                </ul>
            </nav>  
        </div>
        <div class="theme-switch">
            <button id="theme-toggle"  aria-label="Switch theme" data-i18n="switch_theme">Switch to dark mode</button>
        </div>
    </div>

    <main class="container">
        <article>
            <header>
                <h1 data-i18n="page_title">4-7-8 Breathing Exercise</h1>
                <p data-i18n="page_description">The 4-7-8 breathing technique is a relaxation exercise. Inhale for 4 seconds, hold for 7 seconds, exhale for 8 seconds. Repeat 4 times.</p>
            </header>
            <div id="instruction" aria-live="polite" data-i18n="press_start">Press start to begin</div>
            <div id="cycle-counter" aria-live="polite" data-i18n="cycle_counter" data-i18n-args="0">Cycle: 0/4</div>
            <div class="control-buttons">
                <button id="start" class="primary" data-i18n="start">Start</button>
                <button id="stop" class="contrast" disabled data-i18n="stop">Stop</button>
            </div>
            <div id="progress"></div>
        </article>
    </main>


    <button class="music-toggle" aria-label="Toggle music player">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"></path>
            <circle cx="6" cy="18" r="3"></circle>
            <circle cx="21" cy="16" r="3"></circle>
        </svg>
    </button>
    <footer class="music-player">
        <div class="sound-controls grid">
            <label for="background-sound" data-i18n="background_sound">Background Sound:</label>
            <select id="background-sound">
                <option value="" data-i18n-option="none">None</option>
                <option value="meditation-spiritual-music" data-i18n-option="meditation_music">Meditation Spiritual Music</option>
                <option value="middle-east-oriental-music" data-i18n-option="oriental_music">Middle East Oriental Music</option>
                <option value="round-of-fairies-quot-irish-harp" data-i18n-option="irish_harp">Irish Harp</option>
                <option value="the-voice-of-the-oud" data-i18n-option="oud">Voice of the Oud</option>
                <option value="tibetan-singing-bowl" data-i18n-option="tibetan_bowl">Tibetan Singing Bowl</option>
            </select>
            <div class="button-group">
                <button id="play-sound" class="secondary" disabled data-i18n="play">Play</button>
                <button id="pause-sound" class="secondary" disabled data-i18n="pause">Pause</button>
            </div>
        </div>
    </footer>
    <script type="module" src="app.js"></script>
</body>
</html>
